[project]
name = "esa-robot-coding-challenge"
version = "0.1.0"
description = "ESA asteroid robot coding challenge solution"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
exclude = [
    "DISCOVERED_ORIGINAL_FILES",
    "tests_php",
    "vendor",
]
